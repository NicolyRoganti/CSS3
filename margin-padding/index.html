<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Margin e Padding</title>
    <style>
      div {
        border: 2px solid orange;
        width: 700px;
        padding: 50px;
        margin: 0 auto;
      }
      h1 {
        border: 2px solid blue;
        margin: 0px;
        /* 
        margin-top: 50px;
        margin-right: 30px;
        margin-bottom: 100px;
        margin-left: 30px; 
        */
      }
      p {
        border: 2px solid green;
        margin: 0px;
        padding: 20px 50px 30px 100px;
        /* 
        padding-top: 20px;
        padding-right: 50px;
        padding-left: 100px;
        padding-bottom: 30px;
        */
      }
    </style>
  </head>
  <body>
    <div>
      <h1>Explicações Margin e Padding</h1>
      <p>
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Id saepe eum
        iusto delectus laudantium voluptas veniam dolor, ullam eos repudiandae
        dolore quasi quidem laboriosam deserunt inventore exercitationem ea
        magnam! Dicta!
      </p>
    </div>
  </body>
</html>

<!-- 
MARGIN: é a propriedade que define a margem de um elemento, 
ou seja, o espaço entre o elemento e os elementos ao seu redor.
PADDING: é a propriedade que define o preenchimento interno 
de um elemento, ou seja, o espaço entre o conteúdo do elemento 
e sua borda.
-->
