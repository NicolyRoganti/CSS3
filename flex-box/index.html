<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flex Box</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-shadow: none;
      }
      .container {
        border: 1px solid green;
        display: flex; /* Coloca um container flexível um do lado do outro */
        flex-direction: row; /* Define a direção dos elementos filhos como linha */
        justify-content: center; /* Alinha os elementos filhos no centro do container */
        gap: 10px; /* Define um espaçamento entre os elementos filhos */
        background-color: rgb(190, 175, 4);
      }
      .cards {
        border: 1px solid orange;
        height: 400px;
        width: 300px;
        background-color: blue;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="cards"></div>
      <div class="cards"></div>
      <div class="cards"></div>
      <div class="cards"></div>
    </div>
  </body>
</html>
